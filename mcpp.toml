[package]
name        = "kizi"
version     = "0.9.0"
description = "The Kiz Programming Language Interpreter"
license     = "Apache-2.0"
standard    = "c++20"

[toolchain]
macos = "llvm@23.1.3"

[build]
sources     = ["src/**/*.cpp", "libs/**/*.cpp"]
include_dirs = ["src", "depends", "libs"]
cxxflags    = ["-Ofast"]

[target.macos.build]
ldflags     = ["-framework CoreFoundation", "-framework CoreGraphics"]
